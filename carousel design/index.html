<style>
  /* tweaks bridge — token overrides applied by main.jsx */
  .dir-aurora {
    --violet: var(--tw-aurora-accent, #7c5cff);
    --grad-hero: var(--tw-aurora-grad, linear-gradient(135deg,#d9c8ff,#ffd6e7,#c9e4ff));
    --grad-button: var(--tw-aurora-btn, linear-gradient(135deg,#7c5cff,#ff6b9d));
    --radius-card: var(--tw-radius-card, 18px);
    --radius-pill: var(--tw-radius-pill, 999px);
  }
  .dir-hangang {
    --mint: var(--tw-hangang-accent, #2d7a5f);
    --grad-button: linear-gradient(180deg, var(--tw-hangang-accent,#2d7a5f) 0%, color-mix(in srgb, var(--tw-hangang-accent,#2d7a5f) 70%, black) 100%);
  }
  .frame { font-size: calc(1em * var(--tw-font-scale, 1)); }
  body { background: #ece9e2; }
  #root { width: 100vw; height: 100vh; }
</style>
